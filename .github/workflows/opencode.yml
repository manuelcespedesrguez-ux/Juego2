name: opencode
on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    # Solo se ejecuta si el comentario contiene '/oc'
    if: contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Definimos el modelo aquí para evitar el error
      MODEL: anthropic/claude-3-5-sonnet-20240620 
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # Asegúrate de que el nombre del secreto coincida exactamente con lo que tienes en GitHub
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
